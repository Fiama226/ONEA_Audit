repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: ^frontend/src/api/schema\.d\.ts$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3 # keep identical to the ruff pin in backend/pyproject.toml
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check (backend)
        entry: sh -c 'cd backend && uv lock --check'
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock)$
      - id: images-pinned
        name: container images pinned (version + digest)
        entry: sh scripts/verifier-epinglage.sh
        language: system
        pass_filenames: false
        files: ^(docker/|\.github/workflows/)
      - id: mypy
        name: mypy (backend)
        entry: sh -c 'cd backend && mypy .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]
      - id: eslint
        name: eslint (frontend)
        entry: sh -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js)$
      - id: prettier
        name: prettier (frontend)
        entry: sh -c 'cd frontend && npx prettier --check .'
        language: system
        pass_filenames: false
        files: ^frontend/
