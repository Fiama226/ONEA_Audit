[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
strict = True
exclude = (\.venv|migrations)/

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-environ.*]
ignore_missing_imports = True

[mypy-auditlog.*]
ignore_missing_imports = True

[mypy-mozilla_django_oidc.*]
ignore_missing_imports = True

[mypy-docxtpl.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-apps.core.tasks]
disallow_untyped_decorators = False

[mypy-tests.factories]
ignore_errors = True

[mypy-django_filters.*]
ignore_missing_imports = True

[mypy-apps.core.filters]
disallow_subclassing_any = False

[mypy-apps.referentiel.filters]
disallow_subclassing_any = False

[mypy-apps.programmation.filters]
disallow_subclassing_any = False

[mypy-tests.referentiel.*]
# factory_boy factories are untyped (same exemption as tests.factories)
disallow_untyped_calls = False

[mypy-tests.missions.*]
# factory_boy factories are untyped and mypy infers factory classes as instances (same
# exemption as tests.factories)
ignore_errors = True

[mypy-tests.analyse.*]
# factory_boy factories are untyped and mypy infers factory classes as instances: only these
# error codes are disabled (other errors stay active, unlike tests.missions)
disable_error_code = no-untyped-call, attr-defined, union-attr, return-value, no-any-return, arg-type, list-item, misc

[mypy-tests.accomplissement.*]
# factory_boy factories are untyped and mypy infers factory classes as instances: only these
# error codes are disabled (same as tests.analyse)
disable_error_code = no-untyped-call, attr-defined, union-attr, return-value, no-any-return, arg-type, list-item, misc, assignment, call-arg, operator

[mypy-apps.missions.filters]
disallow_subclassing_any = False

[mypy-apps.documents.filters]
disallow_subclassing_any = False

[mypy-apps.analyse.filters]
disallow_subclassing_any = False

[mypy-apps.users.filters]
disallow_subclassing_any = False

[mypy-apps.users.account_filters]
disallow_subclassing_any = False

[mypy-tests.users.test_account_api]
disallow_untyped_calls = False

[mypy-tests.programmation.factories]
ignore_errors = True

[mypy-tests.programmation.*]
disallow_untyped_calls = False

[mypy-tests.accomplissement.factories]
ignore_errors = True
