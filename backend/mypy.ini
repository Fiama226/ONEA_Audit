[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
strict = True
exclude = (\.venv|migrations)/

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-environ.*]
ignore_missing_imports = True

[mypy-auditlog.*]
ignore_missing_imports = True

[mypy-tests.factories]
ignore_errors = True
