[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
strict = True
exclude = (\.venv|migrations)/

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-environ.*]
ignore_missing_imports = True

[mypy-auditlog.*]
ignore_missing_imports = True

[mypy-mozilla_django_oidc.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-apps.core.tasks]
disallow_untyped_decorators = False

[mypy-tests.factories]
ignore_errors = True

[mypy-django_filters.*]
ignore_missing_imports = True

[mypy-apps.core.filters]
disallow_subclassing_any = False

[mypy-apps.referentiel.models]
# django-fsm ships no type hints
disallow_untyped_calls = False

[mypy-tests.referentiel.*]
# factory_boy factories are untyped (same exemption as tests.factories)
disallow_untyped_calls = False
