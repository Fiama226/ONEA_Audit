[project]
name = "onea-audit-backend"
version = "0.1.0"
description = "ONEA internal audit platform - backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-spectacular[sidecar]>=0.27",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "django-auditlog>=3.0",
    "django-fsm>=2.8",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "mozilla-django-oidc>=4.0",
    "django-storages[s3]>=1.14",
    "gunicorn>=22.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory_boy>=3.3",
    "ruff==0.17.3",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.uv]
package = false
