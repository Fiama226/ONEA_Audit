[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = .
python_files = test_*.py
addopts = -ra -m "not perf"
markers =
    meili: integration test needing a running Meilisearch (skipped when MEILI_URL does not answer)
    gotenberg: integration test needing a running Gotenberg (skipped when /health does not answer)
    perf: mesure de temps de reponse sur base de volumetrie (exclu par defaut ; pytest -m perf)
