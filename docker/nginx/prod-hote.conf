# ONEA edge BEHIND A HOST NGINX (docker/compose.vps-hote.yml). Variant of prod.conf: plain HTTP on port 80
# inside the container, published on 127.0.0.1 only; TLS, certificates and the HTTP->HTTPS redirect
# belong to the host nginx (docs/deploiement-vps-existant.md). Everything else (CSP and security
# headers, rate limit, upload size, proxying) is identical to prod.conf. X-Forwarded-Proto is fixed to
# https: the only way in is the host vhost, which serves HTTPS only.
#
# Mounted as /etc/nginx/templates/default.conf.template: the official nginx image runs
# envsubst on it at start-up, restricted to PUBLIC_* variables (NGINX_ENVSUBST_FILTER),
# so nginx's own $variables are untouched.
#   PUBLIC_HOST  application host name, e.g. audit.onea.bf
# Single origin: the SPA (/) and the API (/api/) are served from the same host, so the session
# cookie and the CSRF protection work without CORS.
# Certificates (mounted read-only): /etc/nginx/certs/fullchain.pem and privkey.pem, valid
# for the host name.
#
# nginx OWNS the security headers (HSTS, CSP, X-Frame-Options, ...). Headers Django also
# emits are hidden from upstream responses so each header appears exactly once.

# Strict CSP for the SPA and the API. Swagger UI (/api/docs/, admin-only) needs inline
# script/style, so it gets its own relaxed policy.
map $uri $onea_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/api/docs/ "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

# JSON access log (stdout). $uri carries no query string, so no token or identifier typed in a
# URL ever reaches the log. $remote_addr is the real client (see conf.d/realip.conf).
log_format onea_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time","request_id":"$request_id"}';
# access_log is set in each server block (the image's http-level "main" log, with the query string, is overridden there).

# Rate limiting (per client address; with realip enabled, the address behind the upstream proxy).
limit_req_zone $binary_remote_addr zone=onea_api:10m rate=50r/s;   # /api/: sized for corporate NAT (about 40 users behind one address)
limit_req_status 429;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml font/woff2;

server_tokens off;
client_max_body_size 1m;    # default; /api/ allows evidence uploads (55m, below)

# --- Application ---
server {
    listen 80 default_server;
    server_name ${PUBLIC_HOST};
    access_log /dev/stdout onea_json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $onea_csp always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Collected Django static files (admin, DRF, Swagger UI assets for /api/docs/).
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # API. The forwarded headers are SET (to $remote_addr, the address nginx itself determined),
    # never appended: whatever the client sent is discarded, which is what makes
    # SECURE_PROXY_SSL_HEADER and the trusted-proxy logic safe in config/settings/prod.py.
    location /api/ {
        client_max_body_size 55m;   # evidence uploads (50 MB file + multipart overhead)
        limit_req zone=onea_api burst=100 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;   # gunicorn --timeout is 120 as well
        # nginx is the single owner of these headers.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # Django admin (only when DJANGO_ADMIN_ENABLED=true): same proxying, default 1m body limit.
    location /admin/ {
        limit_req zone=onea_api burst=100 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # SPA (static files + index.html fallback served by the frontend container).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
