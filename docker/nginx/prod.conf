# ONEA production edge: the ONLY container that publishes host ports (80/443).
#
# Mounted as /etc/nginx/templates/default.conf.template: the official nginx image runs
# envsubst on it at start-up, restricted to PUBLIC_* / SSO_* variables (NGINX_ENVSUBST_FILTER),
# so nginx's own $variables are untouched.
#   PUBLIC_HOST  application host name, e.g. audit.onea.bf
#   SSO_HOST     Keycloak host name,    e.g. sso.onea.bf
# $onea_admin_ok comes from conf.d/admin-allow.conf, generated at start-up by
# docker/nginx/10-admin-allow.sh from ADMIN_ALLOW_CIDR (default: nobody).
# Certificates (mounted read-only): /etc/nginx/certs/fullchain.pem and privkey.pem, valid
# for both host names (SAN or wildcard).
#
# nginx OWNS the security headers (HSTS, CSP, X-Frame-Options, ...). Headers Django also
# emits are hidden from upstream responses so each header appears exactly once.

# Strict CSP for the SPA and the API. Swagger UI (/api/docs/, admin-only) needs inline
# script/style, so it gets its own relaxed policy. connect-src allows the OIDC calls
# (discovery, token) the SPA makes to Keycloak.
map $uri $onea_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://${SSO_HOST}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/api/docs/ "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

# JSON access log (stdout). $uri carries no query string, so no token or identifier typed in a
# URL ever reaches the log. $remote_addr is the real client (see conf.d/realip.conf).
log_format onea_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time","request_id":"$request_id"}';
# access_log is set in each server block (the image's http-level "main" log, with the query string, is overridden there).

# Rate limiting (per client address; with realip enabled, the address behind the upstream proxy).
limit_req_zone $binary_remote_addr zone=onea_api:10m rate=50r/s;   # /api/: sized for corporate NAT (about 40 users behind one address)
limit_req_zone $binary_remote_addr zone=onea_sso_auth:10m rate=5r/s;
limit_req_status 429;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml font/woff2;

server_tokens off;
client_max_body_size 1m;    # default; /api/ allows evidence uploads (55m, below)

ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
# Mozilla "intermediate" cipher list
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- HTTP: redirect everything to HTTPS (fixed host, never the client-supplied Host) ---
map $host $onea_http_target {
    default     ${PUBLIC_HOST};
    ${SSO_HOST} ${SSO_HOST};
}

server {
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout onea_json;
    # Each known host is redirected to itself; any other Host goes to the application host.
    return 301 https://$onea_http_target$request_uri;
}

# --- Application ---
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${PUBLIC_HOST};
    access_log /dev/stdout onea_json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $onea_csp always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Collected Django static files (admin, DRF, Swagger UI assets for /api/docs/).
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # API. The forwarded headers are SET (to $remote_addr, the address nginx itself determined),
    # never appended: whatever the client sent is discarded, which is what makes
    # SECURE_PROXY_SSL_HEADER and the trusted-proxy logic safe in config/settings/prod.py.
    location /api/ {
        client_max_body_size 55m;   # evidence uploads (50 MB file + multipart overhead)
        limit_req zone=onea_api burst=100 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;   # gunicorn --timeout is 120 as well
        # nginx is the single owner of these headers.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # Django admin (only when DJANGO_ADMIN_ENABLED=true): same proxying, default 1m body limit.
    location /admin/ {
        limit_req zone=onea_api burst=100 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # SPA (static files + index.html fallback served by the frontend container).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}

# --- Keycloak (SSO) on its own host name ---
# Public: only the realm endpoints used by browsers and the backend (OIDC), plus the login
# theme resources. Everything else - admin console, master realm, metrics, health - answers
# 404 unless the client address is in ADMIN_ALLOW_CIDR.
server {
    listen 443 ssl;
    http2 on;
    server_name ${SSO_HOST};
    access_log /dev/stdout onea_json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Shared proxy settings for every Keycloak location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Master realm = administrators' realm: allow-listed addresses only.
    location ~ ^/realms/master(/|$) {
        if ($onea_admin_ok = 0) { return 404; }
        proxy_pass http://keycloak:8080;
    }

    # Credential-handling endpoints: brute-force friendly, so rate limited.
    location ~ ^/realms/[^/]+/(login-actions/|protocol/openid-connect/token) {
        limit_req zone=onea_sso_auth burst=20 nodelay;
        proxy_pass http://keycloak:8080;
    }

    location /realms/ {
        proxy_pass http://keycloak:8080;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
    }

    location /js/ {
        proxy_pass http://keycloak:8080;
    }

    # Keycloak admin REST API of realm onea: only for the backend sync (peer in the web subnet,
    # see conf.d/admin-allow.conf). The console and the master realm stay behind ADMIN_ALLOW_CIDR.
    location ^~ /admin/realms/onea/ {
        if ($onea_kc_sync_ok = 0) { return 404; }
        proxy_pass http://keycloak:8080;
    }

    # Admin console (/admin/), /metrics, /health, welcome page...: allow-list only.
    location / {
        if ($onea_admin_ok = 0) { return 404; }
        proxy_pass http://keycloak:8080;
    }
}
