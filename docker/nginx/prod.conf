# ONEA production edge: the ONLY container that publishes host ports (80/443).
#
# Mounted as /etc/nginx/templates/default.conf.template: the official nginx image runs
# envsubst on it at start-up, restricted to PUBLIC_* / SSO_* variables (NGINX_ENVSUBST_FILTER),
# so nginx's own $variables are untouched.
#   PUBLIC_HOST  application host name, e.g. audit.onea.bf
#   SSO_HOST     Keycloak host name,    e.g. sso.onea.bf
# $onea_admin_ok comes from conf.d/admin-allow.conf, generated at start-up by
# docker/nginx/10-admin-allow.sh from ADMIN_ALLOW_CIDR (default: nobody).
# Certificates (mounted read-only): /etc/nginx/certs/fullchain.pem and privkey.pem, valid
# for both host names (SAN or wildcard).
#
# nginx OWNS the security headers (HSTS, CSP, X-Frame-Options, ...). Headers Django also
# emits are hidden from upstream responses so each header appears exactly once.

# Strict CSP for the SPA and the API. Swagger UI (/api/docs/, admin-only) needs inline
# script/style, so it gets its own relaxed policy. connect-src allows the OIDC calls
# (discovery, token) the SPA makes to Keycloak.
map $uri $onea_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://${SSO_HOST}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/api/docs/ "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

# Rate limiting (per client address).
limit_req_zone $binary_remote_addr zone=onea_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=onea_sso_auth:10m rate=5r/s;
limit_req_status 429;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml font/woff2;

server_tokens off;
client_max_body_size 50m;   # evidence (piece justificative) uploads

ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
# Mozilla "intermediate" cipher list
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- HTTP: redirect everything to HTTPS (fixed host, never the client-supplied Host) ---
server {
    listen 80 default_server;
    server_name _;
    return 301 https://${PUBLIC_HOST}$request_uri;
}

# --- Application ---
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${PUBLIC_HOST};

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $onea_csp always;

    # Collected Django static files (admin, DRF, Swagger UI assets for /api/docs/).
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # API (and Django admin when DJANGO_ADMIN_ENABLED=true).
    # The forwarded headers are SET, never appended: whatever the client sent is discarded,
    # which is what makes SECURE_PROXY_SSL_HEADER safe in config/settings/prod.py.
    location ~ ^/(api|admin)/ {
        limit_req zone=onea_api burst=40 nodelay;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;   # gunicorn --timeout is 120 as well
        # nginx is the single owner of these headers.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
    }

    # SPA (static files + index.html fallback served by the frontend container).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}

# --- Keycloak (SSO) on its own host name ---
# Public: only the realm endpoints used by browsers and the backend (OIDC), plus the login
# theme resources. Everything else - admin console, master realm, metrics, health - answers
# 404 unless the client address is in ADMIN_ALLOW_CIDR.
server {
    listen 443 ssl;
    http2 on;
    server_name ${SSO_HOST};

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Shared proxy settings for every Keycloak location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Master realm = administrators' realm: allow-listed addresses only.
    location ~ ^/realms/master(/|$) {
        if ($onea_admin_ok = 0) { return 404; }
        proxy_pass http://keycloak:8080;
    }

    # Credential-handling endpoints: brute-force friendly, so rate limited.
    location ~ ^/realms/[^/]+/(login-actions/|protocol/openid-connect/token) {
        limit_req zone=onea_sso_auth burst=20 nodelay;
        proxy_pass http://keycloak:8080;
    }

    location /realms/ {
        proxy_pass http://keycloak:8080;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
    }

    location /js/ {
        proxy_pass http://keycloak:8080;
    }

    # Admin console (/admin/), /metrics, /health, welcome page...: allow-list only.
    location / {
        if ($onea_admin_ok = 0) { return 404; }
        proxy_pass http://keycloak:8080;
    }
}
