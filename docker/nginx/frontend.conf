# Static SPA server inside the frontend image (plain HTTP, internal network only).
# The public edge (TLS, security headers, API proxy) is docker/nginx/prod.conf.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets: cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html (client-side routing).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
