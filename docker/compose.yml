# ONEA audit platform - base infrastructure services (no dev-only material here).
# Secrets are REQUIRED (no defaults): provide them through the repo-root .env
# (docker compose --env-file .env ...). Dev values live in .env.example.
# Host ports, Keycloak and Mailpit are defined in docker/compose.dev.yml.
name: ${COMPOSE_PROJECT_NAME:-onea}

services:
  db:
    image: postgres:16.14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onea}
      POSTGRES_USER: ${POSTGRES_USER:-onea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: valkey/valkey:7.2.15
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required (see .env.example)}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    command: ["gotenberg", "--api-port=3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped


volumes:
  db-data:
  redis-data:
  meili-data:
