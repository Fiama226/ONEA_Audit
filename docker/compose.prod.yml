# ONEA audit platform - PRODUCTION definition (standalone: do not combine with compose.yml
# or compose.dev.yml). See docs/deploy.md.
#
#   docker compose --env-file .env.prod -f docker/compose.prod.yml up -d --build
#
# Every secret is REQUIRED (${VAR:?}); copy .env.prod.example to .env.prod and fill it in.
# Only nginx publishes host ports (80/443).
#
# Networks (docs/deploy.md has the table):
#   edge     standard: nginx only (ports 80/443)
#   web      internal, fixed subnet ONEA_SUBNET_WEB: nginx (fixed address ONEA_NGINX_IP, alias
#            ${SSO_HOST}), web, worker. The only client address web/gunicorn trusts is nginx's.
#   front    internal: nginx, frontend
#   sso      internal: nginx, keycloak (Keycloak 8080/9000 are reachable from nginx only)
#   kc-out   standard: keycloak only (LDAP egress)
#   mail-out standard: worker only (SMTP egress; web has no route out)
#   backend  internal: web, worker, beat, migrate, db, redis, meilisearch, gotenberg
#   kc       internal: keycloak, keycloak-db
name: ${COMPOSE_PROJECT_NAME:-onea-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *logging
  restart: unless-stopped

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (see .env.prod.example)}
  DATABASE_URL: postgres://${POSTGRES_USER:-onea}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-onea}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  EMAIL_URL: ${EMAIL_URL:?EMAIL_URL is required (e.g. smtp+tls://user:pass@smtp.example.org:587)}
  ALLOWED_HOSTS: ${PUBLIC_HOST:?PUBLIC_HOST is required}
  CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
  # The only trusted proxy is nginx, at its fixed address on the `web` network.
  TRUSTED_PROXY_CIDRS: ${ONEA_NGINX_IP:-172.30.10.2}
  # gunicorn reads this variable itself (never "*").
  FORWARDED_ALLOW_IPS: ${ONEA_NGINX_IP:-172.30.10.2}
  OIDC_OP_BASE_URL: https://${SSO_HOST:?SSO_HOST is required}/realms/onea
  OIDC_RP_CLIENT_ID: onea-backend
  # Unused by the Bearer path; mozilla-django-oidc reads it at init, hence required.
  OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET:?OIDC_RP_CLIENT_SECRET is required}
  # Service account (view-users + manage-users) used to sync accounts with Keycloak.
  KEYCLOAK_ADMIN_API_CLIENT_ID: onea-admin-sync
  KEYCLOAK_ADMIN_API_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:?KEYCLOAK_ADMIN_API_CLIENT_SECRET is required}
  DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-false}
  THROTTLE_RATE_GENERATION: ${THROTTLE_RATE_GENERATION:-20/min}
  THROTTLE_RATE_APERCU: ${THROTTLE_RATE_APERCU:-30/min}
  THROTTLE_RATE_TELEVERSEMENT: ${THROTTLE_RATE_TELEVERSEMENT:-30/hour}
  THROTTLE_RATE_IMPORT: ${THROTTLE_RATE_IMPORT:-10/hour}
  THROTTLE_RATE_EXPORT: ${THROTTLE_RATE_EXPORT:-30/min}
  THROTTLE_RATE_ANONYME: ${THROTTLE_RATE_ANONYME:-30/min}
  THROTTLE_RATE_ANNUAIRE: ${THROTTLE_RATE_ANNUAIRE:-60/min}
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
  GOTENBERG_URL: http://gotenberg:3000
  # Host folder mounted on web and worker only (DOCUMENTS_HOST_DIR); see docs/stockage-fichiers.md.
  DOCUMENTS_ROOT: /var/lib/onea/documents
  # Internal CA: path (inside the container) of a PEM bundle under /etc/onea/ca, see
  # docs/deploy.md. Empty = Python's default trust store.
  REQUESTS_CA_BUNDLE: ${SSO_CA_BUNDLE_PATH:-}

x-ca-volume: &ca-volume ../certs:/etc/onea/ca:ro

services:
  # --- One-shot: migrations + static files (restart "no"); app services wait for it ---
  migrate:
    <<: *hardening
    restart: "no"
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    environment: *backend-env
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # --- Application ---
  web:
    <<: *hardening
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    volumes:
      - *ca-volume
      - type: bind
        source: ${DOCUMENTS_HOST_DIR:?DOCUMENTS_HOST_DIR is required}
        target: /var/lib/onea/documents
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [web, backend]

  worker:
    <<: *hardening
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    environment: *backend-env
    volumes:
      - *ca-volume
      - type: bind
        source: ${DOCUMENTS_HOST_DIR:?DOCUMENTS_HOST_DIR is required}
        target: /var/lib/onea/documents
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
    # mail-out: the only service allowed to reach the organisation's SMTP relay.
    # web: Keycloak admin sync goes through nginx.
    networks: [backend, web, mail-out]

  beat:
    <<: *hardening
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || test -f /tmp/celerybeat-schedule.db"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  frontend:
    <<: *hardening
    # nginx master needs to bind port 80 and drop to the nginx user.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
        VITE_OIDC_AUTHORITY: https://${SSO_HOST:?SSO_HOST is required}/realms/onea
        VITE_OIDC_CLIENT_ID: onea-frontend
    image: onea-frontend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    networks: [front]

  # --- Edge: the only service with host ports ---
  nginx:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      SSO_HOST: ${SSO_HOST:?SSO_HOST is required}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC|SSO)_"
      # Addresses allowed to reach the Keycloak admin console / master realm (empty = none)
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-}
      # Upstream load balancers/proxies (CIDR) allowed to set the client address through
      # X-Forwarded-For (empty = nginx sees the TCP peer, the default).
      TRUSTED_UPSTREAM_CIDRS: ${TRUSTED_UPSTREAM_CIDRS:-}
      # Subnet allowed to reach the Keycloak admin REST API of realm onea (account sync).
      ONEA_SUBNET_WEB: ${ONEA_SUBNET_WEB:-172.30.10.0/28}
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/10-admin-allow.sh:/docker-entrypoint.d/10-admin-allow.sh:ro
      - ./nginx/20-realip.sh:/docker-entrypoint.d/20-realip.sh:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required (directory with fullchain.pem and privkey.pem)}:/etc/nginx/certs:ro
      - static:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget -q --spider --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      edge: {}
      web:
        ipv4_address: ${ONEA_NGINX_IP:-172.30.10.2}
        aliases:
          - ${SSO_HOST}
      front: {}
      sso: {}

  # --- Infrastructure (no host ports) ---
  db:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onea}
      POSTGRES_USER: ${POSTGRES_USER:-onea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    <<: *hardening
    cap_add: [SETUID, SETGID, CHOWN]
    image: valkey/valkey:7.2.15@sha256:828b1cbb1c258e02b9cd9588063fa997e097444e610d3f3c00d43e21400e2b8d
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  meilisearch:
    <<: *hardening
    image: getmeili/meilisearch:v1.12.8@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  gotenberg:
    <<: *hardening
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    command: ["gotenberg", "--api-port=3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    # backend only: no route out for document conversion.
    networks: [backend]

  # Keycloak has its own PostgreSQL instance (separate database, credentials and volume).
  keycloak-db:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kc]

  # PRODUCTION mode: `start`, no realm import, no dev realm, no test users.
  # The realm is created by hand (docs/deploy.md). TLS terminates at nginx, which forwards
  # X-Forwarded-*; KC_HOSTNAME is the public https URL.
  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: https://${SSO_HOST:?SSO_HOST is required}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # No curl in the image: raw HTTP on the management port through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sso, kc, kc-out]


networks:
  edge: {}
  web:
    internal: true
    ipam:
      config:
        - subnet: ${ONEA_SUBNET_WEB:-172.30.10.0/28}
          # Dynamic range apart from ONEA_NGINX_IP (.2): otherwise web/worker grab .2 first and nginx
          # fails to start (Address already in use). ONEA_NGINX_IP must stay OUTSIDE this range.
          ip_range: ${ONEA_IP_RANGE_WEB:-172.30.10.8/29}
  front:
    internal: true
  sso:
    internal: true
  kc-out: {}
  mail-out: {}
  backend:
    internal: true
  kc:
    internal: true

volumes:
  db-data:
  keycloak-db-data:
  redis-data:
  meili-data:
  static:
