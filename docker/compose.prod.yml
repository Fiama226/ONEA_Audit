# ONEA audit platform - PRODUCTION definition (standalone: do not combine with compose.yml
# or compose.dev.yml). See docs/deploy.md.
#
#   docker compose --env-file .env.prod -f docker/compose.prod.yml up -d --build
#
# Secrets (lot 9, T17, D16) are FILES, never environment values: ONEA_SECRETS_DIR (root, 0700, files
# 0600) is generated by scripts/generer-secrets.sh and mounted by the `secrets:` below under
# /run/secrets; `docker inspect` therefore shows file paths only. Only the two Keycloak secrets
# (KEYCLOAK_ADMIN_PASSWORD, KEYCLOAK_DB_PASSWORD) stay in .env.prod: Keycloak reads no file.
# Compose ignores uid/gid/mode of file secrets: the host files must belong to 10001:10001 (the
# generator does it when run as root). db, redis and meilisearch read them as root (DAC_OVERRIDE).
# Copy .env.prod.example to .env.prod and fill it in.
# Only nginx publishes host ports (80/443).
#
# Networks (docs/deploy.md has the table):
#   edge     standard: nginx only (ports 80/443)
#   web      internal, fixed subnet ONEA_SUBNET_WEB: nginx (fixed address ONEA_NGINX_IP, alias
#            ${SSO_HOST}), web, worker. The only client address web/gunicorn trusts is nginx's.
#   front    internal: nginx, frontend
#   sso      internal: nginx, keycloak (Keycloak 8080/9000 are reachable from nginx only)
#   kc-out   standard: keycloak only (LDAP egress)
#   mail-out standard: worker only (SMTP egress; web has no route out)
#   backend  internal: web, worker, beat, migrate, db, redis, meilisearch, gotenberg
#   av       internal: clamav, web, worker (clamd 3310 is reachable from these three only)
#   av-out   standard: clamav only (freshclam signature update; clamd itself accepts no one there)
#   kc       internal: keycloak, keycloak-db
name: ${COMPOSE_PROJECT_NAME:-onea-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *logging
  restart: unless-stopped

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY_FILE: /run/secrets/secret_key
  # Old Django keys still accepted during a rotation (empty file = none), docs/deploy.md section 3bis.
  SECRET_KEY_FALLBACKS_FILE: /run/secrets/secret_key_fallbacks
  # Application role (D6, lot 9 T10): no superuser, not the table owner, no DELETE/TRUNCATE. The
  # owner (POSTGRES_USER) is used only by `migrate` below and by backups.
  DATABASE_URL: postgres://${POSTGRES_APP_USER:-onea_app}@db:5432/${POSTGRES_DB:-onea}
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
  POSTGRES_APP_USER: ${POSTGRES_APP_USER:-onea_app}
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  # Without the password (it comes from the email_password secret, worker only): smtp+tls://user@host:587
  EMAIL_URL: ${EMAIL_URL:?EMAIL_URL is required (e.g. smtp+tls://user@smtp.example.org:587)}
  ALLOWED_HOSTS: ${PUBLIC_HOST:?PUBLIC_HOST is required}
  CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
  # The only trusted proxy is nginx, at its fixed address on the `web` network.
  TRUSTED_PROXY_CIDRS: ${ONEA_NGINX_IP:-172.30.10.2}
  # gunicorn reads this variable itself (never "*").
  FORWARDED_ALLOW_IPS: ${ONEA_NGINX_IP:-172.30.10.2}
  OIDC_OP_BASE_URL: https://${SSO_HOST:?SSO_HOST is required}/realms/onea
  OIDC_RP_CLIENT_ID: onea-backend
  # Unused by the Bearer path; mozilla-django-oidc reads it at init, hence required.
  OIDC_RP_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
  # Service account (view-users + manage-users) used to sync accounts with Keycloak.
  KEYCLOAK_ADMIN_API_CLIENT_ID: onea-admin-sync
  KEYCLOAK_ADMIN_API_CLIENT_SECRET_FILE: /run/secrets/keycloak_sync_secret
  DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-false}
  FICHIERS_RACINE: /var/lib/onea/fichiers
  THROTTLE_RATE_GENERATION: ${THROTTLE_RATE_GENERATION:-20/min}
  THROTTLE_RATE_APERCU: ${THROTTLE_RATE_APERCU:-30/min}
  THROTTLE_RATE_TELEVERSEMENT: ${THROTTLE_RATE_TELEVERSEMENT:-30/hour}
  THROTTLE_RATE_IMPORT: ${THROTTLE_RATE_IMPORT:-10/hour}
  THROTTLE_RATE_EXPORT: ${THROTTLE_RATE_EXPORT:-30/min}
  THROTTLE_RATE_ANONYME: ${THROTTLE_RATE_ANONYME:-30/min}
  THROTTLE_RATE_ANNUAIRE: ${THROTTLE_RATE_ANNUAIRE:-60/min}
  THROTTLE_RATE_RECHERCHE: ${THROTTLE_RATE_RECHERCHE:-60/min}
  THROTTLE_RATE_CONNEXION: ${THROTTLE_RATE_CONNEXION:-20/min}
  THROTTLE_RATE_MOT_DE_PASSE_OUBLIE: ${THROTTLE_RATE_MOT_DE_PASSE_OUBLIE:-5/hour}
  THROTTLE_RATE_GESTION_COMPTES: ${THROTTLE_RATE_GESTION_COMPTES:-30/hour}
  # Base of the links in reminder e-mails (https:// required by prod.py) and the daily reminder switch.
  PLATEFORME_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
  RELANCES_ACTIVES: ${RELANCES_ACTIVES:-true}
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key
  GOTENBERG_URL: http://gotenberg:3000
  # SEC-04: ClamAV scans every upload (documents, evidence, pieces, imports). Fail closed: clamd
  # unreachable => upload refused (503). ANTIVIRUS_MOTEUR=aucun is refused by prod.py.
  ANTIVIRUS_MOTEUR: ${ANTIVIRUS_MOTEUR:-clamav}
  ANTIVIRUS_ECHEC_FERME: ${ANTIVIRUS_ECHEC_FERME:-true}
  ANTIVIRUS_AUTORISER_AUCUN: ${ANTIVIRUS_AUTORISER_AUCUN:-false}
  ANTIVIRUS_CLAMD_HOTE: clamav
  ANTIVIRUS_CLAMD_PORT: "3310"
  # Host folder mounted on web and worker only (DOCUMENTS_HOST_DIR); see docs/stockage-fichiers.md.
  DOCUMENTS_ROOT: /var/lib/onea/documents
  # Internal CA: path (inside the container) of a PEM bundle under /etc/onea/ca, see
  # docs/deploy.md. Empty = Python's default trust store.
  REQUESTS_CA_BUNDLE: ${SSO_CA_BUNDLE_PATH:-}

x-ca-volume: &ca-volume ../certs:/etc/onea/ca:ro

services:
  # --- One-shot: migrations + static files (restart "no"); app services wait for it ---
  migrate:
    <<: *hardening
    restart: "no"
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py configurer_recherche && python manage.py collectstatic --noinput"]
    # Owner connection: creates tables, installs the freeze triggers and grants the application role.
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://${POSTGRES_USER:-onea}@db:5432/${POSTGRES_DB:-onea}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [secret_key, secret_key_fallbacks, postgres_password, redis_password, oidc_client_secret, keycloak_sync_secret, meili_master_key]
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks: [backend]

  # --- Application ---
  web:
    <<: *hardening
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [secret_key, secret_key_fallbacks, postgres_app_password, redis_password, oidc_client_secret, keycloak_sync_secret, meili_master_key, metrics_token]
    volumes:
      - *ca-volume
      - onea-fichiers:/var/lib/onea/fichiers
      - type: bind
        source: ${DOCUMENTS_HOST_DIR:?DOCUMENTS_HOST_DIR is required}
        target: /var/lib/onea/documents
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [web, backend, av]

  worker:
    <<: *hardening
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    environment:
      <<: *backend-env
      # Only the worker reaches the SMTP relay (mail-out). Empty file = password of EMAIL_URL, if any.
      EMAIL_PASSWORD_FILE: /run/secrets/email_password
    secrets: [secret_key, secret_key_fallbacks, postgres_app_password, redis_password, oidc_client_secret, keycloak_sync_secret, meili_master_key, email_password]
    volumes:
      - *ca-volume
      - onea-fichiers:/var/lib/onea/fichiers
      - type: bind
        source: ${DOCUMENTS_HOST_DIR:?DOCUMENTS_HOST_DIR is required}
        target: /var/lib/onea/documents
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
    # mail-out: the only service allowed to reach the organisation's SMTP relay.
    # web: Keycloak admin sync goes through nginx.
    networks: [backend, web, mail-out, av]

  beat:
    <<: *hardening
    image: onea-backend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    secrets: [secret_key, secret_key_fallbacks, postgres_app_password, redis_password, oidc_client_secret, keycloak_sync_secret, meili_master_key]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || test -f /tmp/celerybeat-schedule.db"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  frontend:
    <<: *hardening
    # nginx master needs to bind port 80 and drop to the nginx user.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
        VITE_OIDC_AUTHORITY: https://${SSO_HOST:?SSO_HOST is required}/realms/onea
        VITE_OIDC_CLIENT_ID: onea-frontend
    image: onea-frontend:${APP_VERSION:?APP_VERSION is required (e.g. 1.0.0)}
    networks: [front]

  # --- Edge: the only service with host ports ---
  nginx:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      SSO_HOST: ${SSO_HOST:?SSO_HOST is required}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC|SSO)_"
      # Addresses allowed to reach the Keycloak admin console / master realm (empty = none)
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-}
      # Upstream load balancers/proxies (CIDR) allowed to set the client address through
      # X-Forwarded-For (empty = nginx sees the TCP peer, the default).
      TRUSTED_UPSTREAM_CIDRS: ${TRUSTED_UPSTREAM_CIDRS:-}
      # Subnet allowed to reach the Keycloak admin REST API of realm onea (account sync).
      ONEA_SUBNET_WEB: ${ONEA_SUBNET_WEB:-172.30.10.0/28}
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/10-admin-allow.sh:/docker-entrypoint.d/10-admin-allow.sh:ro
      - ./nginx/20-realip.sh:/docker-entrypoint.d/20-realip.sh:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required (directory with fullchain.pem and privkey.pem)}:/etc/nginx/certs:ro
      - static:/var/www/static:ro
      # Webroot du defi ACME http-01 (voie Let's Encrypt, docs/deploy.md section 2).
      - ${ACME_WEBROOT:-/var/www/onea-acme}:/var/www/acme:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget -q --spider --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      edge: {}
      web:
        ipv4_address: ${ONEA_NGINX_IP:-172.30.10.2}
        aliases:
          - ${SSO_HOST}
      front: {}
      sso: {}

  # --- Infrastructure (no host ports) ---
  # ClamAV (GPL-2.0): SEPARATE container, no code link with the application (docs/securite/licences.md).
  # clamd (TCP 3310, INSTREAM) is reachable from web and worker only (network av, internal); the only
  # route out is freshclam's signature update (network av-out, nobody else attached). Signatures live
  # in a volume so a restart does not download them again. The image runs clamd/freshclam as the
  # unprivileged `clamav` user; it needs no capability once started (cap_drop ALL from `hardening`).
  clamav:
    <<: *hardening
    image: clamav/clamav:1.4.3
    environment:
      CLAMAV_NO_MILTERD: "true"
      # Files up to 50 MB are accepted by the application (nginx 55m): the daemon must follow.
      CLAMD_CONF_StreamMaxLength: 55M
      CLAMD_CONF_MaxFileSize: 55M
      CLAMD_CONF_MaxScanSize: 200M
      CLAMD_CONF_ReadTimeout: "60"
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav-signatures:/var/lib/clamav
    mem_limit: ${CLAMAV_MEM_LIMIT:-3g}
    healthcheck:
      # Shipped by the image: PINGs clamd on its configured socket (answers only once signatures are loaded).
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads ~300 MB of signatures, then loads them (1-3 minutes).
      start_period: 300s
    networks: [av, av-out]

  db:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onea}
      POSTGRES_USER: ${POSTGRES_USER:-onea}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Read by postgres/initdb/10-role-applicatif.sh (first start of an empty volume only).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-onea_app}
    # The image reads POSTGRES_PASSWORD_FILE itself; the application-role password is read here, as
    # root, and exported to the init script only (never written in the container configuration).
    entrypoint:
      - sh
      - -c
      - >-
        POSTGRES_APP_PASSWORD="$$(cat /run/secrets/postgres_app_password)" &&
        export POSTGRES_APP_PASSWORD && exec docker-entrypoint.sh "$$@"
      - docker-entrypoint
    command: ["postgres"]
    secrets: [postgres_password, postgres_app_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    <<: *hardening
    # DAC_OVERRIDE: root reads the secret file (owned by 10001) before valkey drops privileges.
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    image: valkey/valkey:7.2.15@sha256:828b1cbb1c258e02b9cd9588063fa997e097444e610d3f3c00d43e21400e2b8d
    # The password goes to valkey through its configuration on stdin ("-"): neither in the container
    # environment nor in the process arguments.
    entrypoint:
      - sh
      - -c
      - >-
        printf "requirepass %s\nappendonly yes\n" "$$(cat /run/secrets/redis_password)" |
        exec docker-entrypoint.sh valkey-server -
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" valkey-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  meilisearch:
    <<: *hardening
    image: getmeili/meilisearch:v1.12.8@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
    # DAC_OVERRIDE: root reads the secret file (owned by 10001).
    cap_add: [DAC_OVERRIDE]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    command:
      - sh
      - -c
      - >-
        MEILI_MASTER_KEY="$$(cat /run/secrets/meili_master_key)" &&
        export MEILI_MASTER_KEY && exec /bin/meilisearch
    secrets: [meili_master_key]
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  gotenberg:
    <<: *hardening
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    command: ["gotenberg", "--api-port=3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    # backend only: no route out for document conversion.
    networks: [backend]

  # Keycloak has its own PostgreSQL instance (separate database, credentials and volume).
  keycloak-db:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kc]

  # PRODUCTION mode: `start`, no realm import, no dev realm, no test users.
  # The realm is created by hand (docs/deploy.md). TLS terminates at nginx, which forwards
  # X-Forwarded-*; KC_HOSTNAME is the public https URL.
  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: https://${SSO_HOST:?SSO_HOST is required}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    volumes:
      - ./keycloak/themes/onea:/opt/keycloak/themes/onea:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # No curl in the image: raw HTTP on the management port through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sso, kc, kc-out]


networks:
  edge: {}
  web:
    internal: true
    ipam:
      config:
        - subnet: ${ONEA_SUBNET_WEB:-172.30.10.0/28}
          # Dynamic range apart from ONEA_NGINX_IP (.2): otherwise web/worker grab .2 first and nginx
          # fails to start (Address already in use). ONEA_NGINX_IP must stay OUTSIDE this range.
          ip_range: ${ONEA_IP_RANGE_WEB:-172.30.10.8/29}
  front:
    internal: true
  sso:
    internal: true
  kc-out: {}
  mail-out: {}
  av:
    internal: true
  av-out: {}
  backend:
    internal: true
  kc:
    internal: true

secrets:
  secret_key:
    file: ${ONEA_SECRETS_DIR:?ONEA_SECRETS_DIR is required (sh scripts/generer-secrets.sh)}/secret_key
  secret_key_fallbacks:
    file: ${ONEA_SECRETS_DIR}/secret_key_fallbacks
  postgres_password:
    file: ${ONEA_SECRETS_DIR}/postgres_password
  postgres_app_password:
    file: ${ONEA_SECRETS_DIR}/postgres_app_password
  redis_password:
    file: ${ONEA_SECRETS_DIR}/redis_password
  oidc_client_secret:
    file: ${ONEA_SECRETS_DIR}/oidc_client_secret
  keycloak_sync_secret:
    file: ${ONEA_SECRETS_DIR}/keycloak_sync_secret
  meili_master_key:
    file: ${ONEA_SECRETS_DIR}/meili_master_key
  metrics_token:
    file: ${ONEA_SECRETS_DIR}/metrics_token
  email_password:
    file: ${ONEA_SECRETS_DIR}/email_password

volumes:
  db-data:
  keycloak-db-data:
  redis-data:
  meili-data:
  static:
  # Pièces justificatives du lot 6 : jamais dans Git, jamais exposées par nginx, à sauvegarder.
  onea-fichiers:
  # ClamAV signature database (main/daily/bytecode.cvd): rebuilt by freshclam, not to be backed up.
  clamav-signatures:
