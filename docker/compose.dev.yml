# Development overlay: publishes host ports and adds Mailpit.
# Every host port can be overridden (see .env.example) when it is already taken.
services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  keycloak:
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  meilisearch:
    ports:
      - "${MEILI_PORT:-7700}:7700"

  gotenberg:
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional same-origin proxy (frontend + API), enabled with: --profile proxy
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8081}:80"
