# Development overlay: publishes host ports and adds Mailpit (dev e-mail catcher).
# DEV ONLY - production is docker/compose.prod.yml.
# Every host port can be overridden (see .env.example) when it is already taken.
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  meilisearch:
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"

  gotenberg:
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional same-origin proxy (frontend + API), enabled with: --profile proxy
  nginx:
    image: nginx:1.27.5-alpine
    profiles: ["proxy"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-8081}:80"

  # --- Celery worker/beat: built from the production backend image ---
  # The image comes from docker/backend.Dockerfile; ../backend is bind-mounted over /app so
  # code changes are picked up on restart (dev settings).
  worker:
    build: &backend_build
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: onea-backend:dev
    volumes:
      - ../backend:/app
    environment: &celery_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-onea}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/${POSTGRES_DB:-onea}
      REDIS_URL: redis://redis:6379/0
      EMAIL_URL: smtp://mailpit:1025
    # The default queue and `auth` (authentication emails, CELERY_TASK_ROUTES).
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "celery,auth"]
    healthcheck:
      disable: true  # the image HEALTHCHECK targets gunicorn, not celery
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: *backend_build
    image: onea-backend:dev
    volumes:
      - ../backend:/app
    environment: *celery_env
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
