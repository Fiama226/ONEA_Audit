# Development overlay: publishes host ports, adds Keycloak (start-dev, test realm)
# and Mailpit. DEV ONLY - production is docker/compose.prod.yml.
# Every host port can be overridden (see .env.example) when it is already taken.
services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  meilisearch:
    ports:
      - "${MEILI_PORT:-7700}:7700"

  gotenberg:
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required (see .env.example)}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Substituted into realm-onea.json (${OIDC_RP_CLIENT_SECRET}) at import time.
      OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET:?OIDC_RP_CLIENT_SECRET is required (see .env.example)}
      # Secret of the onea-admin-sync service account (${KEYCLOAK_ADMIN_API_CLIENT_SECRET} in the realm).
      KEYCLOAK_ADMIN_API_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:?KEYCLOAK_ADMIN_API_CLIENT_SECRET is required (see .env.example)}
    volumes:
      - ./keycloak/realm-onea.json:/opt/keycloak/data/import/realm-onea.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # No curl in the image: raw HTTP on the management port through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional same-origin proxy (frontend + API), enabled with: --profile proxy
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8081}:80"

  # --- Celery worker/beat: built from the production backend image ---
  # The image comes from docker/backend.Dockerfile; ../backend is bind-mounted over /app so
  # code changes are picked up on restart (dev settings).
  worker:
    build: &backend_build
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: onea-backend:dev
    volumes:
      - ../backend:/app
    environment: &celery_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-onea}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/${POSTGRES_DB:-onea}
      REDIS_URL: redis://redis:6379/0
      EMAIL_URL: smtp://mailpit:1025
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      disable: true  # the image HEALTHCHECK targets gunicorn, not celery
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: *backend_build
    image: onea-backend:dev
    volumes:
      - ../backend:/app
    environment: *celery_env
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
