# CI for GitHub Actions; also valid for Gitea Actions (act_runner) - only plain `run` steps and
# widely mirrored first-party actions are used. No secrets are needed: every credential below
# is a throw-away value for ephemeral service containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs of a branch/PR are cancelled; runs on the default branch never are.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: onea
          POSTGRES_USER: onea
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onea -d onea" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: valkey/valkey:7.2.15
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:8.37.0
        ports: ["3000:3000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:3000/health || exit 1" --health-interval 5s
          --health-timeout 5s --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.12.8
        env:
          MEILI_MASTER_KEY: ci-throwaway-meili-key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health || exit 1" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://onea:ci-throwaway-password@127.0.0.1:5432/onea
      REDIS_URL: redis://127.0.0.1:6379/0
      GOTENBERG_URL: http://127.0.0.1:3000
      MEILI_URL: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ci-throwaway-meili-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (runtime + dev group)
        run: uv sync --frozen
      - name: Put the locked environment on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Pytest (coverage gate 80%)
        run: pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  api-fresh:
    # Fails when frontend/src/api/schema.d.ts is stale w.r.t. the backend OpenAPI schema.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --project backend
      - run: echo "$PWD/backend/.venv/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: sh scripts/check-api-fresh.sh

  images:
    # Build only (no push) to prove both production images build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: onea-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: onea-frontend:ci
          build-args: |
            VITE_API_URL=https://audit.example.org
            VITE_OIDC_AUTHORITY=https://sso.example.org/realms/onea

  e2e:
    # Runs the same way as the local verification (dev compose db/redis/keycloak + Django dev
    # server + Vite through Playwright's webServer) but has not been exercised on a real
    # runner yet: keep it non-blocking until its first green run, then remove this line.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://onea:onea-dev-password@127.0.0.1:5432/onea
      DJANGO_SETTINGS_MODULE: config.settings.dev
      VITE_API_URL: http://localhost:8000
      VITE_OIDC_AUTHORITY: http://localhost:8080/realms/onea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the dev stack (db, redis, keycloak with the dev realm)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker/compose.yml -f docker/compose.dev.yml up -d db redis keycloak
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/realms/onea >/dev/null 2>&1 && exit 0
            sleep 5
          done
          docker compose -f docker/compose.yml -f docker/compose.dev.yml logs keycloak
          exit 1
      - name: Start the API
        working-directory: backend
        run: |
          uv sync --frozen
          export PATH="$PWD/.venv/bin:$PATH"
          python manage.py migrate --noinput
          nohup python manage.py runserver 8000 --noreload > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health/ && exit 0; sleep 2; done
          cat ../api.log
          exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f docker/compose.yml -f docker/compose.dev.yml down -v

  dependency-audit:
    # Licences (allowed list: CLAUDE.md rule 2), CycloneDX SBOMs and known-vulnerability audit.
    # Needs network access (PyPI/OSV and npm advisory databases).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: bash scripts/audit-dependances.sh build/audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: build/audit/

  secrets-scan:
    # Leak detection (lot 9, T17): gitleaks (MIT) on the whole history, rules in .gitleaks.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          "$GITLEAKS_IMAGE" git --redact --no-banner -c /repo/.gitleaks.toml /repo